  DESCRICAO_GENERICA:
    desc_regex: '^(MATERIAL|MATERIAIS|PRODUTO|PRODUTOS|MERCADORIA|DIVERSOS|CONF\.? PEDIDO|CONFORME PEDIDO)\b'
    mensagem: Descrição genérica demais para sustentar o crédito
  FORNECEDOR_SIMPLES:
    crt_em: ["1", "2", "4"]
    mensagem: Fornecedor do Simples Nacional — crédito limitado e sem diferimento do Anexo IX
  FORNECEDOR_PESSOA_FISICA:
    emitente_cpf: true
    mensagem: Emitente pessoa física — verificar crédito presumido (art. 168)
  DESTINATARIO_DIVERGENTE:
    mensagem: Destinatário diferente do produtor ou de suas inscrições estaduais
  NCM_DESCRICAO_INCOERENTE:
    mensagem: Categoria pelo NCM difere da categoria pela descrição — revisar
