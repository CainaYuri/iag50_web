# IAG 5.0 — Tabela de tratamento tributário IBS/CBS (versão 1)
# Fonte: LC 214/2025 (texto consolidado, com alterações da LC 227/2026 e LC 235/2026),
#        Anexo IX conforme publicação do Senado Federal.
# STATUS: rascunho técnico — TODAS as linhas exigem revisão de especialista tributário
#         antes do uso em relatório para cliente. Conferir redação vigente e atos de
#         revisão do Anexo IX (art. 138, § 10: revisão a cada 120 dias).
versao: 1
vigencia_inicio: 2026-10-14
referencia_legal: "LC 214/2025 consolidada até LC 235/2026 (27/08/2026)"

# ---------------------------------------------------------------------------
# 1. Catálogo de tratamentos (o "efeito" que o simulador usa)
# ---------------------------------------------------------------------------
tratamentos:
  T00:
    nome: Alíquota padrão — crédito integral
    reducao: 0.0
    diferimento: false
    efeito_credito: CREDITO_INTEGRAL
    fundamento: "Art. 47 (não cumulatividade ampla)"
    cclasstrib_ref: "000001 (conferir)"
    cclasstrib_esperados: ["000001"]
  T01:
    nome: Insumo agropecuário Anexo IX — redução 60% com diferimento
    reducao: 0.60
    diferimento: true
    efeito_credito: SEM_CREDITO_DIFERIDO
    fundamento: "Art. 138, caput, § 1º e § 2º, I, 'a'"
    cclasstrib_ref: "515001 diferido / 200038 sem diferimento (conferir)"
    cclasstrib_esperados: ["515001"]   # 200038 indica que o fornecedor não aplicou o diferimento
    nota: >-
      Fornecedor do regime regular -> produtor contribuinte: recolhimento diferido.
      Não há imposto destacado nem crédito para o produtor; o insumo chega sem
      IBS/CBS no preço. Redução só vale com registro no MAPA quando exigido (§ 1º).
      Fornecedor do Simples Nacional não está no diferimento (§ 2º, I) — ver modificador.
  T02:
    nome: Produto agropecuário in natura — redução 60%
    reducao: 0.60
    diferimento: false
    efeito_credito: CREDITO_INTEGRAL
    fundamento: "Art. 137"
    cclasstrib_ref: "conferir tabela oficial"
    nota: "Crédito calculado sobre a alíquota reduzida (40% da alíquota padrão)."
  T03:
    nome: Combustível — regime monofásico (ad rem)
    reducao: null
    diferimento: false
    efeito_credito: CREDITO_AD_REM
    fundamento: "Arts. 172 a 180; art. 180, § 1º c/c art. 47, § 4º"
    cclasstrib_ref: "conferir tabela oficial"
    nota: >-
      Crédito = valor fixo por unidade (litro/kg) definido para o combustível,
      não percentual sobre o preço. Parametrizar R$/unidade no simulador.
  T04:
    nome: Uso ou consumo pessoal — crédito vedado
    reducao: null
    diferimento: false
    efeito_credito: VEDADO
    fundamento: "Art. 57, I e § 5º"
  T05:
    nome: Operação sem aquisição onerosa
    reducao: null
    diferimento: false
    efeito_credito: NEUTRO
    fundamento: "Não há fornecimento oneroso ao produtor"
  T07:
    nome: Depende de destinação ou vínculo — revisão obrigatória
    reducao: null
    diferimento: null
    efeito_credito: REVISAR
    fundamento: "Art. 57 (uso pessoal x atividade) ou condição do Anexo IX"

