# Regras que valem só pela categoria (aplicadas antes do mapa por NCM)
mapa_por_categoria:
  PESS: T04
  NEUTRO: T05
  COMB.DIE: T03
  COMB.GLP: T03
  COMB.GAS: T07
  COMB.ETA: T07
  GRAO: T07
  MED.HUM: T07
  ALIM.FUNC: T07
  VEI.PASS: T07
  ALIM.PET: T07
  NC: T07
# Observação: categorias de insumo (INS.*, PEC.NUT, PEC.SAN, PEC.GEN, PEC.REP) cujo
# NCM não esteja nas linhas do Anexo IX vão para T07 com alerta TRATAMENTO_INDEFINIDO
# (o motor não presume benefício sem NCM compatível).

# Tratamento quando nenhuma linha do mapa casa
tratamento_padrao: T00

# ---------------------------------------------------------------------------
# 3. Modificadores pelo regime do FORNECEDOR (aplicados depois do mapa)
# ---------------------------------------------------------------------------
modificadores_fornecedor:
  SIMPLES:
    condicao: "CRT do emitente = 1, 2 ou 4 (Simples Nacional / MEI)"
    efeito_credito: CREDITO_SIMPLES
    nota: >-
      Sem diferimento do Anexo IX (exige fornecedor do regime regular).
      Crédito limitado ao valor recolhido no Simples, salvo opção do fornecedor
      pelo regime regular de IBS/CBS. Conferir dispositivo e regulamento.
  PRODUTOR_NAO_CONTRIBUINTE:
    condicao: "Emitente pessoa física (CPF) ou produtor rural não contribuinte (art. 164)"
    efeito_credito: CREDITO_PRESUMIDO
    nota: "Crédito presumido do art. 168, com percentuais definidos em ato do Executivo."

# ---------------------------------------------------------------------------
# 4. Tratamento das VENDAS do produtor (para o cálculo do débito) — a validar
